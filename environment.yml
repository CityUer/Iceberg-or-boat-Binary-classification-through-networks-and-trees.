name: iceberg_classify
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy=2.4.*
  - pandas=3.0.*
  - scipy=1.17.*
  - scikit-learn=1.9.*
  - pip:
      # torch CPU build lives on PyTorch's own index, not PyPI
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.14.0+cpu
      - xgboost==3.2.0
      - kaggle==2.2.4
